services:
  postgres:
    image: postgres:17.5-bullseye
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: sambathreasmey
      POSTGRES_PASSWORD: $3ecureP@ssw0rd
      POSTGRES_DB: local_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: reasmeysambath@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Dev@168
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data: